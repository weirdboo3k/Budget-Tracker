<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人予算トラッカー</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <h1>個人予算トラッカー</h1>
  <button id="theme-toggle" class="btn-clear" style="position: absolute; top: 20px; right: 20px;">🌙 ダークモード</button>

  <main class="layout">
    <!-- chart -->
    <section class="chart-section card">
      <div class="section-head">
        <h2>要約チャート</h2>
      </div>
      <canvas id="summary-chart"></canvas>
    </section>

    <!-- form -->
    <section class="form-section card">
      <div class="section-head">
        <h2>収入/支出を追加</h2>
      </div>

      <form id="transaction-form" class="form-grid">
        <label>
          タイプ:
          <select id="type">
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>
        </label>

        <label>
          金額:
          <input type="number" id="amount" step="0.01" min="0" max="999999999" pattern="[0-9.]*" inputmode="decimal" placeholder="0" required />
        </label>

        <label class="span-2">
          カテゴリ:
          <select id="category" required>
            <option value="">カテゴリを選択</option>
            <option value="Salary">給与</option>
            <option value="Freelance">フリーランス</option>
            <option value="Food">食品</option>
            <option value="Transport">交通</option>
            <option value="Entertainment">エンターテイメント</option>
            <option value="Utilities">公共料金</option>
            <option value="Other">その他</option>
          </select>
        </label>

        <div class="btn-row span-2">
          <button type="submit" class="btn-primary">追加</button>
          <button type="button" id="reset-btn" class="btn-danger">すべてリセット</button>
        </div>
      </form>
    </section>

    <!-- history -->
    <section class="table-section card">
      <div class="section-head section-head--split">
        <h2>履歴</h2>
        <button id="export-btn" class="btn-primary">CSVエクスポート</button>
      </div>
        <div class="summary summary-inline">
          <p>収入: <span id="total-income">0</span></p>
          <p>支出: <span id="total-expense">0</span></p>
          <p><span id="balance">現在: 0$</span></p>
        </div>
      </div>

      <!-- Filter -->
      <div class="filter-section">
        <label>検索:</label>
        <input type="text" id="search-input" placeholder="カテゴリで検索..." />
        <label>フィルタ:</label>
        <select id="filter-year">
          <option value="">全年</option>
        </select>
        <select id="filter-month">
          <option value="">全月</option>
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
        <select id="filter-day">
          <option value="">全日</option>
        </select>
        <button type="button" id="clear-filter" class="btn-clear">フィルタクリア</button>
      </div>

      <div class="table-wrap" aria-label="取引履歴">
        <table>
          <thead>
            <tr>
              <th>タイプ</th>
              <th>金額</th>
              <th>カテゴリ</th>
              <th>アクション</th>
            </tr>
          </thead>
          <tbody id="transaction-list"></tbody>
        </table>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/filter.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
